name: Deploy OpenAPI reference to GitHub Pages

on:
  push:
    branches:
      - develop
    paths:
      - "src/lib/schemas/**"
      - "src/lib/openapi/**"
      - "scripts/gen-openapi.ts"
      - "docs/scalar/**"
      - "package.json" # info.version の由来（バージョンバンプでも再公開する）
      - ".github/workflows/deploy-openapi-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI spec
        run: npm run gen:openapi
        env:
          # 本番 API URL を出す場合はリポジトリ変数 OPENAPI_SERVER_URL を設定する（未設定なら localhost のみ）
          OPENAPI_SERVER_URL: ${{ vars.OPENAPI_SERVER_URL }}

      - name: Build Pages site
        run: |
          mkdir -p _site
          cp docs/scalar/index.html _site/index.html
          cp openapi.json _site/openapi.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
